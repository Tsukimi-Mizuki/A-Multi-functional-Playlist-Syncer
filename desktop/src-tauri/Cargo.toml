[package]
name = "lunatic-princess"
version = "1.1.0"
description = "Lunatic Princess desktop client"
authors = ["Tsukimi-Mizuki <Tsukimi_Mizuki@outlook.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lunatic_princess_lib"
# 桌面端只需要 rlib：cdylib 在 windows-gnu + rust-lld 下会因导出表超过 65535 个符号而链接失败。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "fs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
