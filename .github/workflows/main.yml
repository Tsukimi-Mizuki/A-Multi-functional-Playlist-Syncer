name: Build and Release .NET App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许网页手动触发

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 .NET 环境
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # 如果你的项目是 .NET 6 或 7，请修改这里

    - name: 获取版本号
      id: get_version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="0.0.1-manual"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "当前构建的版本号是: $VERSION"

    - name: 还原依赖
      # 还原整个解决方案的依赖，保证所有项目都能正常编译
      run: dotnet restore NeateaseMusicManager.sln

    - name: 编译并发布 (指定桌面项目)
      # 【关键修改】直接指定启动项目的 .csproj 路径，而不是 .sln
      run: dotnet publish src/NeateaseMusicManager.Desktop/NeateaseMusicManager.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ env.VERSION }} -o ./publish

    - name: 压缩打包
      run: Compress-Archive -Path ./publish/* -DestinationPath ./DSH-Win64-v${{ env.VERSION }}.zip

    - name: 创建并发布 Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./DSH-Win64-v${{ env.VERSION }}.zip
        name: Release v${{ env.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
