name: Build and Release .NET App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许网页手动触发

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 .NET 环境
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # 如果你的项目是 .NET 6 或 7，请修改这里（如 '6.0.x'）

    - name: 获取版本号
      id: get_version
      shell: bash
      run: |
        # 如果是打 Tag 触发的，提取 Tag 名（去掉 v）
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          # 如果是手动触发的，给一个默认版本号
          VERSION="0.0.1-manual"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "当前构建的版本号是: $VERSION"

    - name: 侦查当前目录文件 (调试用)
      run: dir

    - name: 还原依赖
      # 不加文件名，让 dotnet 自动寻找当前目录下的 .sln 或 .csproj
      run: dotnet restore

    - name: 编译并发布 (单文件打包)
      # 同样不加文件名，自动寻找项目
      run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ env.VERSION }} -o ./publish

    - name: 压缩打包
      run: Compress-Archive -Path ./publish/* -DestinationPath ./DSH-Win64-v${{ env.VERSION }}.zip

    - name: 创建并发布 Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./DSH-Win64-v${{ env.VERSION }}.zip
        name: Release v${{ env.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
