name: Release

# 推送 v* tag：检查、测试、打包（NSIS 安装包 + 便携版 zip）并创建 GitHub Release。
# 手动运行（workflow_dispatch）：同样检查并打包，但只上传构建产物，不创建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 检查、打包并发布
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # tag 取版本号：兼容 v1.3、V1.0.0、v.1.0.0（旧 tag 的前导点）、v2.0.0-rc.1，两段式补成三段。
      # 没有 tag（手动运行）时用 tauri.conf.json 的版本加 -manual.<运行序号>，只用于产物命名。
      # 外部输入（分支 / tag 名）一律通过 env 传入，不直接拼进脚本。
      - name: 解析版本号
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $conf = Get-Content app/src-tauri/tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $tag = ''
          $fallback = "$($conf.version)-manual.$($env:RUN_NUMBER)"
          if ($env:REF_TYPE -eq 'tag') { $tag = $env:REF_NAME }
          $version = & ./scripts/resolve-version.ps1 -Tag $tag -Fallback $fallback
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Could not resolve the version.' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $version (ref: $($env:REF_TYPE) $($env:REF_NAME))"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 安装 Rust（stable，MSVC）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # cargo fmt --check、clippy -D warnings、cargo test --workspace、pnpm build（tsc + vite）。
      - name: 检查与测试
        run: ./build.ps1 -Test

      # 临时把版本号写进 Cargo.toml / tauri.conf.json / package.json，生成
      # dist-release\LunaticPrincess-<版本>-win-x64-setup.exe、...-portable.zip（exe + 空的 data\）与 SHA256SUMS.txt。
      - name: 打包安装包与便携版
        run: ./build.ps1 -Bundle -Version $env:VERSION

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LunaticPrincess-${{ env.VERSION }}-win-x64
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

      - name: 创建 GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lunatic Princess v${{ env.VERSION }}
          files: dist-release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
