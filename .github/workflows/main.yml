name: Build and Release .NET App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 .NET 环境
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' 

    - name: 获取版本号
      id: get_version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
        else
          TAG="v0.0.1-manual"
        fi
        # 兼容 v1.0.0、v.1.0.0、V1.0.0：去掉前缀 v/V 与多余的前导点，得到合法程序集版本
        VERSION="${TAG#[vV]}"
        VERSION="${VERSION#.}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "TAG=$TAG" >> $GITHUB_ENV
        echo "当前构建的版本号是: $VERSION (tag: $TAG)"

    - name: 编译并发布 (自动查找桌面项目)
      shell: pwsh
      run: |
        $projectFile = (Get-ChildItem -Path src -Recurse -Filter "*Desktop.csproj").FullName
        if (-not $projectFile) {
          Write-Error "未找到 Desktop 项目文件！"
          exit 1
        }
        Write-Host "成功找到项目文件: $projectFile"
        dotnet publish $projectFile -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ env.VERSION }} -o ./publish

    - name: 压缩打包
      run: Compress-Archive -Path ./publish/* -DestinationPath "Lunatic Princess-v${{ env.VERSION }}.zip"

    - name: 创建并发布 Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        files: "Lunatic Princess-v${{ env.VERSION }}.zip"
        name: Lunatic Princess v${{ env.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
