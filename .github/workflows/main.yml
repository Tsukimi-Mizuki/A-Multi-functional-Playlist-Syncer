name: Build and Release .NET App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许网页手动触发

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 .NET 环境
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # 确保版本正确

    - name: 获取版本号
      id: get_version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="0.0.1-manual"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "当前构建的版本号是: $VERSION"

    # 注意：删除了之前的 "还原依赖" 步骤

    - name: 编译并发布 (直接指定桌面项目)
      # 直接对具体负责启动的 Desktop 项目进行发布，内部会自动还原所需依赖
      run: dotnet publish src/NeateaseMusicManager.Desktop/NeateaseMusicManager.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ env.VERSION }} -o ./publish

    - name: 压缩打包
      run: Compress-Archive -Path ./publish/* -DestinationPath ./DSH-Win64-v${{ env.VERSION }}.zip

    - name: 创建并发布 Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./DSH-Win64-v${{ env.VERSION }}.zip
        name: Release v${{ env.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
