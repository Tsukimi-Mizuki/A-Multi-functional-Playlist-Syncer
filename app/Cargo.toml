[workspace]
resolver = "2"
members = ["src-tauri", "crates/lp-core"]

[workspace.package]
version = "2.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Tsukimi-Mizuki/A-Multi-functional-Playlist-Syncer"
authors = ["Tsukimi-Mizuki"]

[workspace.dependencies]
lp-core = { path = "crates/lp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
# 0.61 与 Cargo.lock 中 Tauri 已引入的版本一致。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true