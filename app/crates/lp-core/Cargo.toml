[package]
name = "lp-core"
description = "Lunatic Princess 平台无关业务库"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# weapi 加密：AES-128-CBC（PKCS#7）+ 无填充 RSA（num-bigint 的模幂）。
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
num-bigint = "0.5"
base64 = "0.23"
rand = "0.10"
# eapi（网易云客户端接口，目前只给搜索用）：请求摘要 MD5（crate 名 md-5，代码里是 `md5`；0.10 与 Tauri 依赖树里已有的 digest 0.10 共用，只多这一个 crate），AES-128-ECB 复用上面的 aes。
md-5 = "0.10"
# HTTP：TLS 走系统 Schannel（native-tls），使用系统证书与系统代理设置；不启用 cookie 容器，Cookie 由 NeteaseClient 自行管理。
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "system-proxy", "form", "gzip", "deflate"] }
# 登录二维码：只需要 SVG 渲染。
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# 歌词：QRC / KRC 的 zlib 解压（纯 Rust 后端），以及 LRC / QRC / KRC 解析用的正则。
flate2 = "1.1.10"
regex = "1.13.1"
# 音频标签读写：MP3 / FLAC / M4A / OGG / OPUS / WAV 等容器（对应 C# 的 TagLibSharp）。
lofty = "0.25.5"
# 曲库匹配：.NET 的 NFKC 归一化与 Unicode 通用类别（标点 / 符号 / 控制），用 ICU4X 的内置数据复现（Tauri 的 url 依赖本来就引入了这两个 crate）。
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_properties = "2.4"

# Windows 专属：DPAPI（登录态加密）与已知文件夹查询。windows-sys 是纯 FFI 声明，Tauri 已依赖同一版本。
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util"] }
