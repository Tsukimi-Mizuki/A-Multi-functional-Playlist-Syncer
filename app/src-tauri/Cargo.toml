[package]
name = "lunatic-princess"
description = "Lunatic Princess 桌面外壳（Tauri 2）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "LunaticPrincess"
path = "src/main.rs"

[lib]
name = "lunatic_princess_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
lp-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = [] }
# 选择本地音频文件的系统对话框（查看标签）。
tauri-plugin-dialog = "2.8.4"
